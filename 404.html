<!DOCTYPE html>
<html lang="en">
<head>
<script>
// GitHub Pages has no server-side rewriting, so /player/<userId> 404s here.
// Detect that pattern and redirect to player.html with the id as a query param
// (preserving any existing query string, e.g. ?year=2026). Anything else falls
// through to the normal 404 page below.
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var i = parts.indexOf('player');
  if (i !== -1 && parts.length >= i + 2) {
    var base = parts.slice(0, i).join('/');
    var extra = location.search ? '&' + location.search.slice(1) : '';
    var target = (base ? '/' + base : '') + '/player.html?uid=' + encodeURIComponent(parts[i + 1]) + extra;
    location.replace(target);
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — TNIRankings</title>

</head>
