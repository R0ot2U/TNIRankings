<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faction Tier List — TNIRankings</title>
<meta name="description" content="Warhammer 40,000 faction tier list for Northern Ireland tournaments — S to F tiers ranked by average win rate.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header>
  <a class="site-logo" href="index.html">TNIRankings</a>
  <span class="subtitle" id="season-label"></span>
  <span class="spacer"></span>
  <a class="nav-link" href="index.html">Rankings</a>
  <a class="nav-link" href="factions.html">Factions</a>
  <a class="nav-link active" href="tier-list.html">Tier List</a>
  <a class="nav-link" href="events.html">Events</a>
  <a class="nav-link" href="about.html">About</a>
  <span class="meta-info" id="build-info"></span>
</header>

<main>
  <div class="controls">
    <input class="search-input" type="search" id="search" placeholder="Search faction…" autocomplete="off">
    <div class="btn-group" id="year-btns" role="group" aria-label="Season"></div>
    <span id="row-count" style="color:var(--dim);font-size:0.8rem;margin-left:4px;"></span>
  </div>

  <div class="panel">
    <div class="panel-title">Faction Tier List
      <span class="panel-note">(Northern Ireland · tiered by average win rate — win=1, draw=0.5, loss=0 — across every NI player who played that faction)</span></div>
    <div class="tier-list" id="tier-list">
      <div class="loading">Loading data…</div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="assets/app.js" defer></script>
<script src="assets/tier-list.js" defer></script>
</body>
</html>
